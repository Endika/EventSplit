name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run type:check
      - run: npm run test:run
      - name: Mutation targets
        if: github.event_name == 'pull_request'
        id: targets
        env:
          BASE: origin/${{ github.base_ref }}
        run: echo "files=$(scripts/mutation-targets.sh "$BASE")" >> "$GITHUB_OUTPUT"
      - name: Mutation test the changed logic
        if: github.event_name == 'pull_request' && steps.targets.outputs.files != ''
        timeout-minutes: 40
        env:
          FILES: ${{ steps.targets.outputs.files }}
        run: |
          npm i --no-save @stryker-mutator/core@10.1.1 @stryker-mutator/vitest-runner@10.1.1
          npx stryker run --mutate "$FILES"
